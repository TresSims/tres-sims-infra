---
name: Lint Yaml
on: # yamllint disable-line rule:truthy
  push:
    paths:
      - "*.yaml"
      - "*.yml"
      - .yamllint'
  pull_request:
    paths:
      - "*.yaml"
      - "*.yml"
      - .yamllint'

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .
