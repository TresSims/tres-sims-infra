---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-sync
  path: "./flux-sync"
  prune: false
  timeout: 1m
  ignore:
    - paths:
        - "/spec/suspend"
      target:
        kind: Kustomization
