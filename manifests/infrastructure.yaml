---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-sync
  path: "./infrastructure"
  prune: false
  timeout: 1m
  dependsOn:
    - name: flux-system
  ignore:
    - paths:
        - "/spec/replicas"
      target:
        kind: Kustomization
